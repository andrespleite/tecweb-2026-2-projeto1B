{% extends "notes/base.html" %}
{% load static %}

{% block content %}

<div class="appbar">
  <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
</div>

<main class="container">
  <div class="page-actions">
    <a class="btn btn-secondary" href="{% url 'index' %}">&larr; Voltar ao início</a>
    <a class="btn btn-secondary" href="{% url 'tags_list' %}">Todas as tags</a>
  </div>

  <h1 class="tag-page-title">#{{ tag.title }}</h1>

  <div class="card-container">
    {% for note in notes %}
    <div class="card">
      <h3 class="card-title">{{ note.title }}</h3>
      <div class="card-content">
          <p>{{ note.content }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</main>

<script type="text/javascript" src="{% static 'notes/js/getit.js' %}"></script>

{% endblock %}
