{% extends "notes/base.html" %}
{% load static %}

{% block content %}

<div class="appbar">
  <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
</div>

<main class="container">
  <ul>
    {% for tag in tags %}
      <li><a href="{% url 'tag_detail' tag.id %}">{{ tag.title }}</a></li>
    {% endfor %}
  </ul>
</main>

{% endblock %}
