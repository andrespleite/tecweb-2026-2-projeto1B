{% extends "notes/base.html" %}
{% load static %}

{% block content %}

<div class="appbar">
  <img src="{% static 'notes/img/logo-getit.png' %}" class="logo" />
  <span class="subtitle">Como o Post-it, mas com outro verbo</span>
</div>

<main class="container">
  <div class="page-actions">
    <a class="btn btn-secondary" href="{% url 'index' %}">&larr; Voltar ao início</a>
  </div>

  <div class="tag-table-card">
    <h1 class="tag-page-title">Tags</h1>
    <table class="tag-table">
      {% for tag in tags %}
      <tr>
        <td><a class="tag-table-link" href="{% url 'tag_detail' tag.id %}">#{{ tag.title }}</a></td>
      </tr>
      {% endfor %}
    </table>
  </div>
</main>

{% endblock %}
